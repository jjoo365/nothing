<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무위 無爲 : 물아일체</title>

<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">

<style>
/* ───── 가사 서체 : NewSM견출명조 ─────
   1) 컴퓨터에 설치돼 있으면 그대로 사용
   2) 아니면 index.html 과 같은 폴더의 폰트 파일 사용
      (파일 이름이 다르면 아래 url('...') 안의 이름만 바꾸기)
      ※ 깃허브에 올릴 땐 폰트 파일도 같이 올려야 다른 컴퓨터에서도 보임 */
@font-face {
  font-family: 'NewSMGyeonchul';
  src: local('NewSM견출명조'),
       local('New SM견출명조'),
       url('NewSM견출명조.ttf') format('truetype'),
       url('NewSM견출명조.otf') format('opentype');
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  background: #ffffff;
  overflow: hidden;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

img {
  user-select: none;
  -webkit-user-drag: none;
}


/* =========================================================
   1. 타이틀(로딩) 화면
   ========================================================= */
#intro {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #ffffff;
  cursor: pointer;
  transition: opacity 0.5s ease;
}

#intro img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

#intro.gone {
  opacity: 0;
  pointer-events: none;
}


/* =========================================================
   2. 무대 — 방 그림 비율(2360 x 1640), 화면에 가득 + 가운데 정렬
   ========================================================= */
.stage {
  position: relative;
  width:  min(100vw, calc(100vh * 2360 / 1640));
  height: min(100vh, calc(100vw * 1640 / 2360));
  container-type: size;
  overflow: hidden;
  background: #ffffff;
}

#room {
  position: absolute;
  inset: 0;
  z-index: 1;
}

.full {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

/* ★ 흰 배경은 사라지고 선만 남게 (포토샵 '곱하기') */
.ink {
  mix-blend-mode: multiply;
}


/* ───── 서브 타이틀 (왼쪽 위) ───── 
   subtitle.png 에서 글씨 부분만 잘라서 보여줌 */
#subtitle {
  position: absolute;
  left: 2%;
  top: 2.5%;
  width: 40%;                    /* 크기: 숫자 키우면 커짐 */
  aspect-ratio: 1860 / 225;
  background-image: url(subtitle.png);
  background-repeat: no-repeat;
  background-size: 220.22% 1365.33%;
  background-position: 3.578% 1.932%;
  z-index: 9;
  pointer-events: none;
}

/* ───── 이불 ───── */
.blanket {
  transition: opacity 0.6s ease;
}

.blanket.off {
  opacity: 0;
}


/* ───── 담배 연기 ───── */
#smoke {
  z-index: 3;
  transform-origin: 56.4% 25.6%;
  animation: sway 3.4s ease-in-out infinite alternate;
}

#smoke img {
  opacity: 0;
  transition: opacity 0.45s ease;
}

#smoke img.on {
  opacity: 1;
}

@keyframes sway {
  0%   { transform: rotate(-1.2deg) skewX(-1.5deg); }
  100% { transform: rotate(1.2deg)  skewX(1.5deg); }
}


/* ───── 움직이는 소품 ───── */
.sprite {
  position: absolute;
  left: 0;
  top: 0;
  will-change: transform;
}

.sprite .pic {
  width: 100%;
  height: 100%;
  background-repeat: no-repeat;
}

#roach    { z-index: 4; cursor: pointer; }
#mosquito { z-index: 8; cursor: pointer; }

#mosquito.hide {
  visibility: hidden;
}

/* 잡힌 모기 (납작) */
.corpse {
  z-index: 6;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.corpse .pic {
  animation: squash 0.25s ease-out forwards;
}

@keyframes squash {
  0%   { transform: scale(1, 1); }
  40%  { transform: scale(1.3, 0.6) rotate(8deg); }
  100% { transform: scale(1.15, 0.8) rotate(14deg); }
}

/* 피 터짐 */
.blood {
  z-index: 7;
  pointer-events: none;
  transition: opacity 0.5s ease;
}

.blood .pic {
  animation: splat 0.3s cubic-bezier(.2, 1.6, .4, 1) forwards;
}

@keyframes splat {
  0%   { transform: scale(0.3); }
  100% { transform: scale(1); }
}

.fade {
  opacity: 0 !important;
}

/* 탁! 화면 흔들림 */
.shake {
  animation: shake 0.18s linear;
}

@keyframes shake {
  0%   { transform: translate(0, 0); }
  25%  { transform: translate(-0.4%, 0.3%); }
  50%  { transform: translate(0.3%, -0.3%); }
  75%  { transform: translate(-0.2%, 0.2%); }
  100% { transform: translate(0, 0); }
}


/* ───── 클릭 영역 (투명 버튼) ───── */
.hot {
  position: absolute;
  z-index: 5;
  cursor: pointer;
}

/* H 키: 클릭 영역 빨간 점선으로 보기 */
.debug .hot,
.debug .sprite {
  outline: 2px dashed red;
  background: rgba(255, 0, 0, 0.08);
}


/* =========================================================
   3. 가사
   ========================================================= */
.lyrics {
  position: absolute;
  top: 11%;
  max-height: 86%;
  overflow: hidden;
  white-space: nowrap;
  font-family: 'SM3KMyungJo';
  font-weight: normal;
  font-size: 1.6cqh;
  line-height: 1.85;
  z-index: 20;
  pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 6%, #000 94%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0%, #000 6%, #000 94%, transparent 100%);
}

.lyrics.left  { left: 0%; }
.lyrics.right { right: 0%; }

.line {
  color: #BE8500;
  opacity: 100%;
  
  transition: opacity 0.6s ease, color 0.6s ease;
}

.line.gap  { height: 1.85em; }
.line.past { opacity: 0.28; }
.line.now  { opacity: 100%; color: #BE8500; }
</style>
</head>

<body>

<!-- ───── 1. 타이틀 (로딩) 화면 ───── -->
<div id="intro">
  <img src="title.png" alt="무위 無爲 : 물아일체">
</div>


<!-- ───── 2. 방 ───── -->
<div class="stage" id="stage">
  <div id="room">

    <img src="room.png" class="full" alt="장판 위에 누운 남자">

    <!-- 서브 타이틀 : 흰 배경 없이 글씨만 -->
    <div id="subtitle" class="ink"></div>

    <img src="blanket-open.png"   class="full ink blanket"     id="blanketOpen">
    <img src="blanket-folded.png" class="full ink blanket off" id="blanketFolded">

    <div id="smoke" class="full ink">
      <img src="smoke1.png" class="full on">
      <img src="smoke2.png" class="full">

    <div class="hot" id="hotBlanket"></div>

<audio id="song" src="Lyrics.mp4" preload="auto"></audio>


<script>
/* =========================================================
   ① 가사 붙여넣기  ★ 여기만 하면 끝 ★
   - 아래 ` ` 사이의 예시 글을 지우고, 가사 전문을 그대로 붙여넣기
   - 줄바꿈 안 해도 됨! 한 줄로 쭉 이어진 가사도 코드가 알아서
     적당한 길이로 줄을 나누고, 띄어쓰기 두 칸(  )은 문단 간격으로 바꿈
   - 그 다음 정확히 반으로 나눠 왼쪽 / 오른쪽에 아래로 쭉 배치됨
   ========================================================= */
const lyricsText = `
싸구려 커피를 마신다 미지근해 적잖이 속이 쓰려온다 눅눅한 비닐 장판에 발바닥이 쩍 달라 붙었다 떨어진다  이제는 아무렇지 않어 바퀴벌레 한마리쯤 쓱 지나가도 무거운 내일 아침엔 다만 그저 약간에 기침이 멈출 생각을 않는다 축축한 이불을 갠다 삐걱대는 문을 열고 밖에 나가본다 아직 덜갠 하늘이 너무 가까워 숨쉬기가 쉽지를 않다 수만번 본 것만 같다 어지러워 쓰러질 정도로 익숙하기만 하다 남은 것도 없이 텅빈 나를 잠근다  싸구려 커피를 마신다 미지근해 적잖이 속이 쓰려온다 눅눅한 비닐장판에 발바닥이 쩍하고 달라 붙었다가 떨어진다  뭐 한 몇 년간 세숫대야에 고여있는 물 마냥  그냥 완전히 썩어가지고 이거는 뭐 감각이 없어 비가 내리면 처마 밑에서 쭈그리고 앉아서 멍하니 그냥 가만히 보다보면은  이거는 뭔가 아니다 싶어 비가 그쳐도 희끄므레죽죽한 저게  하늘이라고 머리위를 뒤덮고 있는건지 저거는 뭔가 하늘이라고 하기에는 뭔가 너무 낮게 머리카락에 거의 닿게 조금만 뛰어도  정수리를 쿵! 하고 찧을거 같은데 벽장 속 제습제는 벌써 꽉차 있으나 마나 모기 때려잡다 번진 피가 묻은  거울을 볼때마다 어우! 약간 놀라 제 멋대로 구부러진 칫솔 갖다 이빨을 닦다 보면은 잇몸에 피가 나게 닦아도  당췌 치석은 빠져 나올줄을 몰라 언제 땄는지도 모르는 미지근한 콜라가 담긴 캔을 입에 가져가 한모금 아뿔사 담배 꽁초가 이제는 장판이 난지 내가 장판인지도 몰라 해가 뜨기도 전에 지는 이런 상황은 뭔가  싸구려 커피를 마신다 미지근해 적잖이 속이 쓰려온다 눅눅한 비닐 장판에 발바닥이 쩍 달라 붙었다 떨어진다  이제는 아무렇지 않어 바퀴벌레 한마리쯤 쓱 지나가도 무거운 내일 아침엔 다만 그저 약간에 기침이 멈출 생각을 않는다 축축한 이불을 갠다 삐걱대는 문을 열고 밖에 나가본다 아직 덜갠 하늘이 너무 가까워 숨쉬기가 쉽지를 않다 수만번 본 것만 같다 어지러워 쓰러질 정도로 익숙하기만 하다 남은 것도 없이 텅빈 나를 잠근다  싸구려 커피를 마신다 미지근해 적잖이 속이 쓰려온다 눅눅한 비닐 장판에 발바닥이  쩍 하고 달라 붙었다가 떨어진다
`;

const LINE_LENGTH = 16;   // 자동 줄나눔: 한 줄에 들어갈 최대 글자 수 (늘리면 한 줄이 길어짐)


/* =========================================================
   ② 가사 타이밍 (초 단위). 비워두면 노래 길이에 맞춰 자동 배분
   ========================================================= */
let times = [];
const autoStart  = 15;
const autoEndGap = 10;


/* =========================================================
   ③ 효과음 ('' 로 비워두면 소리 없이 넘어감)
   ========================================================= */
const SOUNDS = {
  cup:     '',     // 예) 'slurp.mp3'
  can:     '',     // 예) 'crush.mp3'
  blanket: '',     // 예) 'blanket.mp3'
  roach:   '',     // 예) 'roach.mp3'
  buzz:    '',     // 예) 'buzz.mp3'  (모기 날아다니는 동안 반복)
  slap:    ''      // 예) 'slap.mp3'
};


/* =========================================================
   그림 원본 크기 & 위치 숫자들 (프로크리에이트 캔버스 픽셀 기준)
   ========================================================= */
const W = 2360;
const H = 1640;

// 클릭 영역 [x, y, 너비, 높이]  (H 키로 확인)
const HOT = {
  cup: [730, 340, 150, 175],
  can: [870, 290, 110, 225]
};

// 이불 클릭 영역 (모양 따라 그린 꼭짓점)
const BLANKET_OPEN_SHAPE   = [[1530,20],[2360,20],[2360,1450],[2140,1450],[2135,1000],[2100,640],[1900,400],[1700,200]];
const BLANKET_FOLDED_SHAPE = [[2040,10],[2360,10],[2360,1450],[2040,1450]];

// 원본 파일에서 각 그림이 그려진 위치 [x, y, 너비, 높이]
const ROACH_BOX    = [1334, 163, 266, 264];
const MOSQUITO_BOX = [420, 250, 198, 168];
const BLOOD_BOX    = [325, 200, 420, 330];

// 바퀴벌레 머리가 원본에서 향하는 각도 (오른쪽 0, 아래 90)
const ROACH_DRAWN_ANGLE = 133;

// 바퀴벌레가 돌아다니는 범위 [왼쪽, 위, 오른쪽, 아래]
const FLOOR = [320, 120, 2050, 1360];

// 모기 관련
const MOSQUITO_RESPAWN = [1.5, 3.5];   // 잡은 뒤 새 모기가 나오기까지 (초, 최소~최대)
const STAIN_TIME       = 0.8;         // 피 자국이 남아있는 시간 (초) — 클수록 오래 남음


/* ===================== 요소 가져오기 ===================== */
const intro    = document.getElementById('intro');
const stage    = document.getElementById('stage');
const room     = document.getElementById('room');
const song     = document.getElementById('song');
const leftCol  = document.getElementById('lyricsLeft');
const rightCol = document.getElementById('lyricsRight');


/* ===================== 작은 도구들 ===================== */
function rand(a, b) { return a + Math.random() * (b - a); }

function pct(v, total) { return (v / total * 100) + '%'; }

function placeBox(el, box) {
  el.style.left   = pct(box[0], W);
  el.style.top    = pct(box[1], H);
  el.style.width  = pct(box[2], W);
  el.style.height = pct(box[3], H);
}

function placeShape(el, points) {
  el.style.inset = '0';
  el.style.clipPath = 'polygon(' + points.map(function (p) {
    return pct(p[0], W) + ' ' + pct(p[1], H);
  }).join(', ') + ')';
}

function play(name, volume) {
  if (!SOUNDS[name]) return null;
  const a = new Audio(SOUNDS[name]);
  a.volume = volume || 1;
  a.play().catch(function () {});
  return a;
}

// 원본 그림에서 필요한 부분만 잘라 움직이는 조각으로 만들기
function makeSprite(id, src, box) {
  const outer = document.createElement('div');
  outer.className = 'sprite ink';
  if (id) outer.id = id;
  outer.style.width  = pct(box[2], W);
  outer.style.height = pct(box[3], H);

  const pic = document.createElement('div');
  pic.className = 'pic';
  pic.style.backgroundImage    = 'url(' + src + ')';
  pic.style.backgroundSize     = (W / box[2] * 100) + '% ' + (H / box[3] * 100) + '%';
  pic.style.backgroundPosition = (box[0] / (W - box[2]) * 100) + '% ' + (box[1] / (H - box[3]) * 100) + '%';

  outer.appendChild(pic);
  room.appendChild(outer);

  return { el: outer, pic: pic, w: box[2], h: box[3], x: 0, y: 0 };
}

// 조각을 캔버스 좌표 (cx, cy) 중심에 놓기
function moveSprite(s, cx, cy) {
  s.x = cx;
  s.y = cy;
  const k = stage.clientWidth / W;
  s.el.style.transform = 'translate(' + ((cx - s.w / 2) * k) + 'px, ' + ((cy - s.h / 2) * k) + 'px)';
}

function angleDiff(a, b) {
  return ((b - a + 540) % 360) - 180;
}


/* =========================================================
   로딩: 타이틀이 떠 있는 동안 그림들 미리 불러오기
   ========================================================= */
['room.png', 'subtitle.png', 'blanket-open.png', 'blanket-folded.png',
 'smoke1.png', 'smoke2.png', 'smoke3.png',
 'roach.png', 'mosquito.png', 'blood.png'].forEach(function (src) {
  new Image().src = src;
});


/* =========================================================
   타이틀 클릭 → 방 등장 + 노래 바로 재생
   ========================================================= */
let started = false;

intro.addEventListener('click', function () {
  if (started) return;
  started = true;

  intro.classList.add('gone');

  song.currentTime = 0;
  song.play().catch(function () {});

  startBuzz();
  lastTime = performance.now();
  requestAnimationFrame(loop);
});


/* =========================================================
   이불: 클릭하면 갬 ↔ 다시 클릭하면 펼침
   ========================================================= */
const blanketOpen   = document.getElementById('blanketOpen');
const blanketFolded = document.getElementById('blanketFolded');
const hotBlanket    = document.getElementById('hotBlanket');
let folded = false;

placeShape(hotBlanket, BLANKET_OPEN_SHAPE);

hotBlanket.addEventListener('click', function () {
  folded = !folded;
  blanketOpen.classList.toggle('off', folded);
  blanketFolded.classList.toggle('off', !folded);
  placeShape(hotBlanket, folded ? BLANKET_FOLDED_SHAPE : BLANKET_OPEN_SHAPE);
  play('blanket');
});


/* =========================================================
   커피잔 / 캔 (소리 넣으면 바로 작동)
   ========================================================= */
const hotCup = document.getElementById('hotCup');
const hotCan = document.getElementById('hotCan');
placeBox(hotCup, HOT.cup);
placeBox(hotCan, HOT.can);

hotCup.addEventListener('click', function () { play('cup'); });
hotCan.addEventListener('click', function () { play('can'); });


/* =========================================================
   담배 연기: 1 → 2 → 3 → 1 …
   ========================================================= */
const smokeFrames = document.querySelectorAll('#smoke img');
const SMOKE_SPEED = 450;   // ms, 클수록 느릿느릿
let smokeIdx = 0;

setInterval(function () {
  smokeFrames[smokeIdx].classList.remove('on');
  smokeIdx = (smokeIdx + 1) % smokeFrames.length;
  smokeFrames[smokeIdx].classList.add('on');
}, SMOKE_SPEED);


/* =========================================================
   바퀴벌레: 멈췄다가 → 스스슥 → 또 멈추고 (몸 위로도 지나감)
   ========================================================= */
const roach = makeSprite('roach', 'roach.png', ROACH_BOX);

const R = {
  x: ROACH_BOX[0] + ROACH_BOX[2] / 2,
  y: ROACH_BOX[1] + ROACH_BOX[3] / 2,
  angle: ROACH_DRAWN_ANGLE,
  tx: 0, ty: 0,
  speed: 0,
  running: false,
  wait: rand(1.5, 3)
};

function roachNewTarget(fast) {
  let tx, ty;
  do {
    tx = rand(FLOOR[0], FLOOR[2]);
    ty = rand(FLOOR[1], FLOOR[3]);
  } while (Math.hypot(tx - R.x, ty - R.y) < (fast ? 900 : 350));
  R.tx = tx;
  R.ty = ty;
  R.speed = fast ? rand(1500, 1900) : rand(650, 1100);
  R.running = true;
  play('roach', 0.6);
}

function updateRoach(dt, t) {
  let wiggle = 0;

  if (R.running) {
    const dx = R.tx - R.x;
    const dy = R.ty - R.y;
    const dist = Math.hypot(dx, dy);

    const want = Math.atan2(dy, dx) * 180 / Math.PI;
    R.angle += angleDiff(R.angle, want) * Math.min(1, dt * 12);

    const step = Math.min(dist, R.speed * dt);
    const rad = R.angle * Math.PI / 180;
    R.x += Math.cos(rad) * step;
    R.y += Math.sin(rad) * step;

    wiggle = Math.sin(t * 45) * 5;

    if (dist < 25 || Math.random() < dt * 0.35) {
      R.running = false;
      R.wait = rand(0.4, 3.2);
    }
  } else {
    wiggle = Math.sin(t * 7) * 2 + (Math.random() < 0.02 ? rand(-8, 8) : 0);
    R.wait -= dt;
    if (R.wait <= 0) roachNewTarget(false);
  }

  moveSprite(roach, R.x, R.y);
  roach.pic.style.transform = 'rotate(' + (R.angle - ROACH_DRAWN_ANGLE + wiggle) + 'deg)';
}

// 클릭 → 화들짝 도망
roach.el.addEventListener('pointerdown', function () {
  roachNewTarget(true);
});


/* =========================================================
   모기: 계속 날아다니고, 잡을 때마다 탁! 피가 터짐
   → 잡으면 그 자리에 납작한 모기 + 피 자국이 남고
     곧바로 새 모기가 화면 밖에서 또 날아옴 (무한 반복)
   ========================================================= */
const mosquito = makeSprite('mosquito', 'mosquito.png', MOSQUITO_BOX);

const BLOOD_OFFSET_X = (BLOOD_BOX[0] + BLOOD_BOX[2] / 2) - (MOSQUITO_BOX[0] + MOSQUITO_BOX[2] / 2);
const BLOOD_OFFSET_Y = (BLOOD_BOX[1] + BLOOD_BOX[3] / 2) - (MOSQUITO_BOX[1] + MOSQUITO_BOX[3] / 2);

const M = {
  x: MOSQUITO_BOX[0] + MOSQUITO_BOX[2] / 2,
  y: MOSQUITO_BOX[1] + MOSQUITO_BOX[3] / 2,
  vx: 0, vy: 0,
  tx: 0, ty: 0,
  retarget: 0,
  alive: true,
  dir: 1,
  buzz: null
};

const stains = [];   // 화면에 남아있는 피 자국들

function mosquitoNewTarget() {
  M.tx = rand(80, W - 80);
  M.ty = rand(80, H - 80);
  M.retarget = rand(0.7, 2.2);
}

function updateMosquito(dt, t) {
  if (!M.alive) return;

  M.retarget -= dt;
  if (M.retarget <= 0) mosquitoNewTarget();

  const ax = (M.tx - M.x) * 2.2 + rand(-1400, 1400);
  const ay = (M.ty - M.y) * 2.2 + rand(-1400, 1400);
  M.vx = (M.vx + ax * dt) * Math.pow(0.25, dt);
  M.vy = (M.vy + ay * dt) * Math.pow(0.25, dt);

  const sp = Math.hypot(M.vx, M.vy);
  const MAX = 650;
  if (sp > MAX) { M.vx *= MAX / sp; M.vy *= MAX / sp; }

  M.x += M.vx * dt;
  M.y += M.vy * dt;

  // 날갯짓 떨림
  const bx = Math.sin(t * 61) * 3;
  const by = Math.cos(t * 47) * 5;

  if (M.vx < -40) M.dir = -1;
  if (M.vx >  40) M.dir =  1;

  moveSprite(mosquito, M.x + bx, M.y + by);
  mosquito.pic.style.transform = 'scaleX(' + M.dir + ') rotate(' + (M.vy * 0.02) + 'deg)';

  if (M.buzz) {
    const d = Math.hypot(M.x - W / 2, M.y - H / 2) / (W / 2);
    M.buzz.volume = Math.max(0.05, Math.min(1, 1 - d * 0.7));
  }
}

function startBuzz() {
  if (M.buzz || !SOUNDS.buzz) return;
  M.buzz = new Audio(SOUNDS.buzz);
  M.buzz.loop = true;
  M.buzz.play().catch(function () {});
}

function stopBuzz() {
  if (M.buzz) { M.buzz.pause(); M.buzz = null; }
}

// 잡힌 자리에 납작한 모기 + 피 남기기
function leaveStain(x, y, dir) {
  const body = makeSprite(null, 'mosquito.png', MOSQUITO_BOX);
  body.el.classList.add('corpse');
  body.el.style.scale = dir + ' 1';
  moveSprite(body, x, y);

  const b = makeSprite(null, 'blood.png', BLOOD_BOX);
  b.el.classList.add('blood');
  b.el.style.rotate = rand(-25, 25) + 'deg';   // 매번 조금씩 다른 모양으로
  moveSprite(b, x + BLOOD_OFFSET_X, y + BLOOD_OFFSET_Y);

  const pair = [body, b];
  stains.push(pair);

  setTimeout(function () {
    body.el.classList.add('fade');
    b.el.classList.add('fade');
  }, STAIN_TIME * 1000);

  setTimeout(function () {
    body.el.remove();
    b.el.remove();
    stains.splice(stains.indexOf(pair), 1);
  }, STAIN_TIME * 1000 + 600);
}

// 모기 클릭 → 잡힘
mosquito.el.addEventListener('pointerdown', function () {
  if (!M.alive) return;
  M.alive = false;

  stopBuzz();
  play('slap');

  leaveStain(mosquito.x, mosquito.y, M.dir);
  mosquito.el.classList.add('hide');

  stage.classList.remove('shake');
  void stage.offsetWidth;
  stage.classList.add('shake');

  setTimeout(respawnMosquito, rand(MOSQUITO_RESPAWN[0], MOSQUITO_RESPAWN[1]) * 1000);
});

function respawnMosquito() {
  const side = Math.floor(rand(0, 4));
  M.x = side === 0 ? -100 : side === 1 ? W + 100 : rand(0, W);
  M.y = side === 2 ? -100 : side === 3 ? H + 100 : rand(0, H);
  M.vx = 0;
  M.vy = 0;
  mosquitoNewTarget();
  M.alive = true;
  mosquito.el.classList.remove('hide');
  startBuzz();
}

mosquitoNewTarget();


/* =========================================================
   매 프레임 움직임
   ========================================================= */
let lastTime = 0;

function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  const t = now / 1000;

  updateRoach(dt, t);
  updateMosquito(dt, t);
  updateLyrics();

  requestAnimationFrame(loop);
}

moveSprite(roach, R.x, R.y);
moveSprite(mosquito, M.x, M.y);

// 창 크기 바뀌면 피 자국 위치도 다시 맞추기
window.addEventListener('resize', function () {
  stains.forEach(function (pair) {
    pair.forEach(function (s) { moveSprite(s, s.x, s.y); });
  });
});


/* =========================================================
   가사
   ========================================================= */
const lineEls = [];

function addLines(lines, col) {
  lines.forEach(function (text) {
    const div = document.createElement('div');
    if (text.trim() === '') {
      div.className = 'line gap';
    } else {
      div.className = 'line';
      div.textContent = text.trim();
      lineEls.push(div);
    }
    col.appendChild(div);
  });
}

// 한 줄로 이어진 가사 → 띄어쓰기 두 칸은 문단, 나머지는 글자 수에 맞춰 줄나눔
function autoLines(text) {
  const out = [];
  text.trim().split(/\s{2,}/).forEach(function (para, p) {
    if (p > 0) out.push('');
    let line = '';
    para.trim().split(/\s+/).forEach(function (word) {
      if (line && (line + ' ' + word).length > LINE_LENGTH) {
        out.push(line);
        line = word;
      } else {
        line = line ? line + ' ' + word : word;
      }
    });
    if (line) out.push(line);
  });
  return out;
}

(function buildLyrics() {
  let raw = lyricsText.trim().includes('\n')
    ? lyricsText.split('\n')   // 직접 줄바꿈 해뒀으면 그대로 사용
    : autoLines(lyricsText);    // 한 줄로 이어져 있으면 자동으로 나눔
  while (raw.length && raw[0].trim() === '') raw.shift();
  while (raw.length && raw[raw.length - 1].trim() === '') raw.pop();

  // 빈 줄을 뺀 실제 가사 줄 수를 세서 정확히 반으로
  const total = raw.filter(function (l) { return l.trim() !== ''; }).length;
  const half  = Math.ceil(total / 2);

  let count = 0;
  let cut = raw.length;
  for (let i = 0; i < raw.length; i++) {
    if (raw[i].trim() !== '') count++;
    if (count === half) { cut = i + 1; break; }
  }

  const leftLines  = raw.slice(0, cut);
  const rightLines = raw.slice(cut);
  while (rightLines.length && rightLines[0].trim() === '') rightLines.shift();

  addLines(leftLines, leftCol);
  addLines(rightLines, rightCol);
})();

function fillAutoTimes() {
  if (times.length >= lineEls.length) return;
  const end  = song.duration - autoEndGap;
  const step = (end - autoStart) / lineEls.length;
  times = [];
  for (let i = 0; i < lineEls.length; i++) times.push(autoStart + step * i);
}

song.addEventListener('loadedmetadata', fillAutoTimes);
if (song.readyState >= 1) fillAutoTimes();

let current = -1;

function updateLyrics() {
  const tt = song.currentTime;
  let idx = -1;
  for (let i = 0; i < lineEls.length; i++) {
    if (times[i] !== undefined && tt >= times[i]) idx = i;
  }
  if (idx === current) return;

  current = idx;
  lineEls.forEach(function (el, i) {
    el.classList.toggle('past', i < idx);
    el.classList.toggle('now',  i === idx);
  });
  if (idx >= 0) {
    const el = lineEls[idx];
    const col = el.parentElement;
    col.scrollTo({ top: el.offsetTop - col.clientHeight / 2, behavior: 'smooth' });
  }
}


/* =========================================================
   ④ H 키 : 클릭 영역 보기/숨기기
   ⑤ 가사 타이밍 녹음 : F12 → Console, 노래 들으며 줄 시작마다 T,
      끝나면 P → 나온 한 줄을 ② 의 let times = []; 자리에 붙여넣기
   ========================================================= */
const recorded = [];

document.addEventListener('keydown', function (e) {
  const k = e.key.toLowerCase();
  if (k === 'h') stage.classList.toggle('debug');
  if (k === 't') {
    recorded.push(Number(song.currentTime.toFixed(2)));
    console.log(recorded.length + '번째 줄: ' + song.currentTime.toFixed(2) + '초');
  }
  if (k === 'p') console.log('let times = ' + JSON.stringify(recorded) + ';');
});
